name: Build & Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin

      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USER }}/yapay-zeka:latest .

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USER }}/yapay-zeka:latest

      - name: Deploy to server (pull + recreate ai-api)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /root/personelim
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
            echo "BACKEND_API_URL=${{ secrets.BACKEND_API_URL }}" >> .env
            docker compose pull ai-api
            docker compose up -d --force-recreate ai-api
            docker image prune -f
