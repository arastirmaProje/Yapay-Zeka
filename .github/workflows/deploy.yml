name: Build & Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin

      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USER }}/yapay-zeka:latest .

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USER }}/yapay-zeka:latest
